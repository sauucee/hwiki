name: hwiki
version: 2.0.0
description: "Combined memory provider: Obsidian-markdown wiki (git-versionable, human-editable) + review-gated fact extraction with local semantic recall, dynamic per-turn injection, contradiction flagging, learning and self-healing. Zero external services."
author: Otto Sulin
license: MIT
homepage: https://github.com/ottosulin/hwiki
capabilities:
  - llm.side_question
manifest_version: 2
requires_hermes: ">=0.21"

# Standard library only. PyYAML (shipped with Hermes) is used opportunistically for frontmatter.
pip_dependencies: []

# Optional, only for backend = "qmd". The setup wizard prints the hint when the binary is
# missing and the provider falls back to FTS5.
external_dependencies:
  - name: qmd
    check: "qmd --version"
    install: "npm install -g @tobilu/qmd   # requires Node.js >= 22"

# All tools (wiki + facts) are served through MemoryProvider.get_tool_schemas();
# the plugin-level hooks below drive the fact extraction/review write path.
provides_tools: []
provides_hooks:
  - post_llm_call
  - on_session_start
  - on_session_finalize
